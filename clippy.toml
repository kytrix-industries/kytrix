# Clippy configuration for the whole workspace.
#
# `large-error-threshold` is raised above its 128-byte default because the
# workspace's error types are deliberately rich: `MarketParticipantError`, `ModelError`,
# `MarketError` and `AccountError` each name the exact route, listing, field or
# operation that failed, which is what lets a caller decide how to react instead
# of matching on free text. Clippy's default sits exactly at the size such an enum
# reaches, so every function that returns one of them would have to box it; boxing
# the whole error surface of four crates is the only alternative, and it buys the
# size of a pointer at the cost of an allocation on every failure path.
large-error-threshold = 256

# Tokio's context-sensitive APIs are denied workspace-wide.
#
# A Tokio runtime is two things at once and its own API spells both `Handle`: the
# capability to put work on the runtime, and the fact that the current thread is
# already inside one. `Handle::spawn` / `Handle::spawn_blocking` need only the
# capability, so they work from any thread, but `tokio::task::spawn_blocking` and
# `Handle::current` need the fact and panic without it with "there is no reactor
# running, must be called from the context of a Tokio 1.x runtime". A service task
# runs on the engine's executor, which is not the runtime's, so it has no such
# context and the panic lands in the middle of a frame.
#
# The workspace passes the runtime `Handle` explicitly everywhere — there is no
# process-global runtime — and these denials make reaching for the context-using
# spells a compile error rather than a matter of remembering.
disallowed-methods = [
    { path = "tokio::task::spawn_blocking", reason = "panics outside a Tokio runtime context, which is exactly where engine tasks run; take the runtime Handle and use Handle::spawn_blocking, which needs only the capability", replacement = "tokio::runtime::Handle::spawn_blocking" },
    { path = "tokio::runtime::Handle::current", reason = "panics outside a runtime context; the runtime is a typed value the composition root hands down, so a test builds its own or uses the crate's shared test handle", replacement = "the typed runtime Handle" },
]
