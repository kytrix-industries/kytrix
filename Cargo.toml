instrument_selector_ui = { path = "crates/instrument_selector_ui" }
kytrix_gui = { path = "crates/kytrix_gui" }
kytrix_service_provider = { path = "crates/kytrix_service_provider" }
market_participants_connector = { path = "crates/market_participants_connector" }
market_participants_model = { path = "crates/market_participants_model" }
market_participants_ui = { path = "crates/market_participants_ui" }
market_trade = { path = "crates/widgets/market_trade" }
network = { path = "crates/network" }
news = { path = "crates/widgets/news" }
order_book = { path = "crates/widgets/order_book" }
perpetual_statistics = { path = "crates/widgets/perpetual_statistics" }
pentagon_pizza_index = { path = "crates/widgets/pentagon_pizza_index" }
prediction_market = { path = "crates/widgets/prediction_market" }
profile_ui = { path = "crates/profile_ui" }
