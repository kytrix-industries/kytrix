[workspace.lints.clippy]
self_named_module_files = "allow"
pub_use = "forbid"
field_scoped_visibility_modifiers = "forbid"
pub_without_shorthand = "forbid"
definition_in_module_root = "forbid"
inline_modules = "forbid"
multiple_inherent_impl = "forbid"
empty_structs_with_brackets = "forbid"
empty_enum_variants_with_brackets = "forbid"
unnecessary_self_imports = "forbid"
unneeded_field_pattern = "forbid"
pub_underscore_fields = "deny"
no_effect_underscore_binding = "forbid"
used_underscore_items = "forbid"
used_underscore_binding = "deny"
too_many_arguments = "allow"
redundant_clone = "deny"
disallowed_methods = "deny"
type_complexity = "allow"
large_enum_variant = "allow"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = "debuginfo"