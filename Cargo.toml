solana_wallet = { path = "crates/widgets/solana_wallet" }
updater_ui = { path = "crates/updater_ui" }
volume_heatmap = { path = "crates/widgets/volume_heatmap" }
watch_list = { path = "crates/widgets/watch_list" }
