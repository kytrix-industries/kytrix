name: GUI CI

# Engine-only gate. The product crates (`crates/kytrix`, `base_ui`, …) still depend on
# `gpui-*` and are not buildable off Windows yet (M8 scope), so every command here is
# scoped to `-p ui_core`.
#
# Not yet proven on hosted runners: this file has only been syntax-checked locally.
# First green run must be recorded in design/DEVIATIONS.md V-102.
on:
  push:
    paths:
      - "../../crates/ui_core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/gui-ci.yml"
  pull_request:
    paths:
      - "../../crates/ui_core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/gui-ci.yml"
  workflow_dispatch:

concurrency:
  group: gui-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  windows:
    name: windows (WARP goldens)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # `+nightly` for clippy/fmt (workspace lints), stable stays the default toolchain
      # so `cargo test` matches the local gate.
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
      - name: Install Rust (stable, default)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: gui-windows

      # build.rs compiles DXIL with dxc.exe (Windows SDK 10.0.26100+), trying
      # %WindowsSdkDir% first; pin the found path explicitly so the runner image
      # changing its default SDK cannot silently fall back to placeholders.
      - name: Locate dxc
        shell: pwsh
        run: |
          $roots = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
            "$env:ProgramFiles\Windows Kits\10\bin"
          )
          $dxc = Get-ChildItem -Path $roots -Filter dxc.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\dxc\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dxc) {
            throw "dxc.exe not found in the Windows SDK (10.0.26100+ required by build.rs)"
          }
          Write-Host "dxc: $($dxc.FullName)"
          "KYTRIX_DXC=$($dxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test (unit)
        run: cargo test -p ui_core

      # Includes the demo example's 36 tests (23 unit + 13 scene, HUD + test-support).
      - name: "Test (test-support + HUD + demo)"
        run: cargo test -p ui_core --features "hud,test-support"

      - name: Pixel goldens (WARP)
        run: cargo test -p ui_core --features test-support --test snapshot -- --nocapture

      - name: Clippy
        run: cargo +nightly clippy -p ui_core --all-targets --all-features -- -D warnings

      - name: Format
        run: cargo +nightly fmt -p ui_core -- --check

      - name: Benches compile
        run: cargo bench -p ui_core --bench perf --no-run

  linux:
    name: linux (Vulkan / Wayland)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
      - name: Install Rust (stable, default)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: gui-linux

      # fontconfig (fontique build script, pkg-config), xkbcommon + wayland (platform
      # backend), glslang-tools for `glslangValidator` (SPIR-V shaders, build.rs).
      # `fonts-noto-cjk` keeps the demo example's "no MissingGlyph" scene tests runnable.
      # Vulkan is loaded at runtime through `ash`, so no libvulkan-dev is needed to build.
      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev glslang-tools fonts-noto-cjk

      - name: Test (unit)
        run: cargo test -p ui_core

      # `--test snapshot` prints one `skip <case>: …` line per golden on non-Windows
      # (WARP-only baselines) and exits 0; see tests/golden/README.md.
      - name: Test (test-support)
        run: cargo test -p ui_core --features test-support

      - name: Clippy
        run: cargo +nightly clippy -p ui_core --all-targets --all-features -- -D warnings

      - name: Format
        run: cargo +nightly fmt -p ui_core -- --check

  macos:
    name: macos (Metal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
      - name: Install Rust (stable, default)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: gui-macos

      # Metal shaders compile with `xcrun metal` (Xcode CLT on the runner); pixel
      # goldens are WARP-only and skip, but `snapshot_result_is_typed_per_platform`
      # asserts that the real Metal offscreen readback path still works.
      - name: Test (unit)
        run: cargo test -p ui_core

      - name: Test (test-support)
        run: cargo test -p ui_core --features test-support

      - name: Clippy
        run: cargo +nightly clippy -p ui_core --all-targets --all-features -- -D warnings

      - name: Format
        run: cargo +nightly fmt -p ui_core -- --check
