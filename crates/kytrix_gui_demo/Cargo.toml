[package]
name = "kytrix_gui_demo"
version.workspace = true
publish.workspace = true
edition.workspace = true

[features]
# P17：demo 默认展示引擎内置 Debug HUD；`--no-default-features` 可构建无 HUD 版本。
default = ["hud"]
hud = ["kytrix_gui/hud"]
# 离屏像素验证（`--snapshot`）：需要引擎的 `test-support`（WARP 渲染 + readback）。
# 默认关闭，发布/手动运行不带测试基建（I7）。
snapshot = ["dep:image", "kytrix_gui/test-support"]

[dependencies]
kytrix_gui = { workspace = true }
tokio = { workspace = true }
# P10：demo 的滚动容器/布局常量需要声明 taffy 样式（引擎 `Style.inner` 的类型）。
taffy = { workspace = true }
# P15：场景状态（`ImeField` / `FocusView`）用短字符串表达，走 `format_smolstr!`（AGENTS §2.2）。
smol_str = { workspace = true }
image = { workspace = true, optional = true }

[dev-dependencies]
# P15：集成测试用 `TestApp`（无 GPU 帧驱动 + a11y 快照捕获）。主二进制不受影响（dev-dep 只在测试目标里）。
kytrix_gui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
