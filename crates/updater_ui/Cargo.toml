[package]
name = "updater_ui"
version.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
ahash.workspace = true
app_config.workspace = true
base_ui.workspace = true
bytes.workspace = true
cargo-packager-updater.workspace = true
download_provider.workspace = true
http.workspace = true
i18n.workspace = true
log.workspace = true
network.workspace = true
reqwest.workspace = true
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
smol_str.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["parsing"] }
tokio.workspace = true
tokio-util.workspace = true
ui_core.workspace = true
url = { workspace = true, features = ["serde"] }
widget.workspace = true

[dev-dependencies]
# The headless engine host (`ui_core::test_support::TestApp`), its layout probe and
# frame record. Only the test build opens the feature.
ui_core = { workspace = true, features = ["test-support"] }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
tempfile.workspace = true

[lints]
workspace = true
