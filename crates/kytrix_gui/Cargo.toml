[package]
name = "kytrix_gui"
version.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# P01 实际使用
smol_str = { workspace = true }
thiserror = { workspace = true }

# P02 颜色 / P03 绘制契约
bitflags = { workspace = true }
bytemuck = { workspace = true }
color = { workspace = true }
lyon = { workspace = true }

# P05 布局 / P06 文本
fontique = { workspace = true }
parley = { workspace = true }
skrifa = { workspace = true }
swash = { workspace = true }
taffy = { workspace = true }

# P09 渲染共享层
etagere = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    # 窗口 / 事件 / DPI / IME
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # D3D12 / DXGI
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
accesskit = { workspace = true }
accesskit_windows = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-quartz-core = { workspace = true }
objc2-metal = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-core-graphics = { workspace = true }
accesskit = { workspace = true }
accesskit_macos = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit = { workspace = true }
accesskit_unix = { workspace = true }
ash = { workspace = true }
calloop = { workspace = true }
calloop-wayland-source = { workspace = true }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }
xkbcommon = { workspace = true }

[lints]
workspace = true
