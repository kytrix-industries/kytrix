[package]
name = "settings_ui"
version.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
ahash = { workspace = true }
gpui-kit = { workspace = true }
i18n = { workspace = true }
log = { workspace = true }
network = { workspace = true }
reqwest = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
widget_tokio_runtime = { workspace = true }

# Workspace members
app_config = { workspace = true }
app_config_provider = { workspace = true }
base_ui = { workspace = true }
market_participants_connector = { workspace = true }
market_participants_model = { workspace = true }
# The layer that names a venue in the reader's language.
widget = { workspace = true }

[dev-dependencies]
# The connection seam a widget test connects a venue through: the crate's own
# `test-support` feature, which is never enabled for a release build.
market_participants_connector = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
tempfile = { workspace = true }

[lints]
workspace = true
