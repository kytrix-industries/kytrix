[package]
name = "ai_provider"
version.workspace = true
publish.workspace = true
edition.workspace = true

[features]
default = ["openmp"]
openmp = ["llama_sys/openmp"]
cuda = ["llama_sys/cuda"]
vulkan = ["llama_sys/vulkan"]
metal = ["llama_sys/metal"]

[dependencies]
llama_sys.workspace = true
log.workspace = true
smol_str.workspace = true
thiserror.workspace = true

# Metal is the only usable GPU backend on macOS, so it is part of the platform
# build rather than an opt-in Cargo feature.
[target.'cfg(target_os = "macos")'.dependencies]
llama_sys = { workspace = true, features = ["metal"] }

[lints]
workspace = true
