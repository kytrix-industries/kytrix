[package]
name = "financial_index"
version.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
ahash = { workspace = true }
app_config = { workspace = true }
base_ui = { workspace = true }
i18n = { workspace = true }
kytrix_proto = { workspace = true }
kytrix_service_provider = { workspace = true }
log = { workspace = true }
network = { workspace = true }
serde = { workspace = true, features = ["derive"] }
smol_str = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

# Workspace members
ui_core = { workspace = true }
widget = { workspace = true }

[dev-dependencies]
# The framework's headless host (`WidgetTestApp`), which composes the same services the
# application root does and hands the widget a `WidgetCx`.
widget = { workspace = true, features = ["test-support"] }
# The engine's headless host (`TestApp`), whose clock is the only one `App::after` reads
# in a test.
ui_core = { workspace = true, features = ["test-support"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
