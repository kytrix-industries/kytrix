[package]
name = "prediction_market"
version.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
ahash = { workspace = true }
futures = { workspace = true }
gpui-kit = { workspace = true }
i18n = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
smol_str = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

# Workspace members
app_config = { workspace = true }
app_config_provider = { workspace = true }
base_ui = { workspace = true }
instrument_selector_ui = { workspace = true }
market_participants_connector = { workspace = true }
market_participants_model = { workspace = true }
widget = { workspace = true }
widget_tokio_runtime = { workspace = true }

[dev-dependencies]
# A pane only reads a venue that is in the loaded-venues view, so a view test has to
# commit one; the fixture seam is how it does that without a venue answering. Never
# enabled for a release build.
market_participants_connector = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
# A config written by an older build has to decode with the fields it never had.
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
