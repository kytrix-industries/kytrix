[package]
name = "coin_market_cap_fear_and_greed_index"
version.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
app_config = { workspace = true }
ui_kit = { workspace = true }
bytes = { workspace = true }
i18n = { workspace = true }
kytrix_proto = { workspace = true }
kytrix_service_provider = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
smol_str = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
ui_core = { workspace = true }
widget = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# The framework's headless host (`WidgetTestApp`), which every interface test of this
# crate drives the widget through; the feature is what turns on the engine's test support.
widget = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
