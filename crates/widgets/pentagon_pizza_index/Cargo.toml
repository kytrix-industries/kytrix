[package]
name = "pentagon_pizza_index"
version.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
app_config = { workspace = true }
app_config_provider = { workspace = true }
base_ui = { workspace = true }
gpui-kit = { workspace = true }
i18n = { workspace = true }
kytrix_service_provider = { workspace = true }
log = { workspace = true }
network = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
url = { workspace = true }
widget = { workspace = true }
widget_tokio_runtime = { workspace = true }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
# The model's fixtures are the feed's own answers, so they are read as the JSON
# they are; production code never touches `serde_json`.
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
