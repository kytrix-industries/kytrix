[package]
name = "pentagon_pizza_index"
version.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
app_config = { workspace = true }
ui_kit = { workspace = true }
i18n = { workspace = true }
kytrix_proto = { workspace = true }
kytrix_service_provider = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
smol_str = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
ui_core = { workspace = true }
widget = { workspace = true }

[dev-dependencies]
# The framework's headless host (`WidgetTestApp`), over the injected services and
# the engine's test support that feature brings with it.
widget = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
