[package]
name = "news"
version.workspace = true
publish.workspace = true
edition.workspace = true

[features]
# The notification sound backend (`rodio` -> `cpal` -> ALSA on Linux). Off for the
# acceptance build, whose Linux host has no `libasound2-dev`; everything above the
# device (the seam, the throttle, the silent host) stays compiled either way.
audio = ["dep:rodio"]

[dependencies]
app_config = { workspace = true }
ui_kit = { workspace = true }
bytes = { workspace = true }
i18n = { workspace = true }
kytrix_service_provider = { workspace = true }
log = { workspace = true }
network = { workspace = true }
rodio = { workspace = true, features = ["playback", "hound"], optional = true }
serde = { workspace = true, features = ["derive"] }
smol_str = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
ui_core = { workspace = true }
widget = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
widget = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
