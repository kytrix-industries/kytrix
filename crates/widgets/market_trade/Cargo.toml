[package]
name = "market_trade"
version.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
app_config = { workspace = true }
ui_kit = { workspace = true }
futures = { workspace = true }
i18n = { workspace = true }
instrument_selector_ui = { workspace = true }
log = { workspace = true }
market_participants_connector = { workspace = true }
market_participants_model = { workspace = true }
serde = { workspace = true, features = ["derive"] }
smol_str = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
ui_core = { workspace = true }
widget = { workspace = true }

[dev-dependencies]
# The connection seam a widget test publishes a catalogue through: the crate's own
# `test-support` feature, which is never enabled for a release build.
market_participants_connector = { workspace = true, features = ["test-support"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# The engine's value-slot statistics (`test_support::diagnostics`), which is what pins that a
# rebuilt kit component hands its signal scope back. Only the test build opens the feature.
ui_core = { workspace = true, features = ["test-support"] }
# The framework's test host (`WidgetTestApp`), which is what every interface test of
# this crate drives the widget through.
widget = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
