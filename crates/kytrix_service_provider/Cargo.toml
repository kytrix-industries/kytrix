[package]
name = "kytrix_service_provider"
version.workspace = true
publish.workspace = true
edition.workspace = true

[features]
# Selects the production account/API origins. Development builds talk to the
# local service on 127.0.0.1; plaintext policy belongs to the transport hub.
production = []

[dependencies]
ahash.workspace = true
app_config.workspace = true
base64.workspace = true
bs58.workspace = true
bytes.workspace = true
futures.workspace = true
gpui-kit.workspace = true
keyring.workspace = true
kytrix_proto.workspace = true
log.workspace = true
network.workspace = true
p256.workspace = true
prost.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = [
    "brotli",
    "default-tls",
    "deflate",
    "form",
    "gzip",
    "stream",
] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
smol_str = { workspace = true, features = ["serde"] }
thiserror.workspace = true
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }
tokio-util.workspace = true
url.workspace = true
uuid.workspace = true
widget_tokio_runtime.workspace = true
yawc.workspace = true

[dev-dependencies]
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
network = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true
