[package]
name = "widget"
version.workspace = true
publish.workspace = true
edition.workspace = true

[features]
# The framework's test host (`widget::test_support`) and, through it, the engine's
# own test support (`TestApp`/`Probe`/`FrameRecord`). Not in the release build.
test-support = ["ui_core/test-support"]

[dependencies]
ahash.workspace = true
bytes.workspace = true
i18n.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
smol_str.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util.workspace = true

# Workspace members
app_config.workspace = true
ui_kit.workspace = true
kytrix_service_provider.workspace = true
market_participants_connector.workspace = true
market_participants_model.workspace = true
network.workspace = true
ui_core.workspace = true

[dev-dependencies]
# The framework's own tests drive `ui_core::test_support` directly; the feature is
# only turned on for test builds (and for external users through `test-support`).
ui_core = { workspace = true, features = ["test-support"] }
# The test host's injection tests build a headless market-participants directory (a
# fixture that proves the seam W1b had to work around with a crate-private source):
# its connector takes the application runtime as a typed value and its settings
# snapshot comes from the provider's notification.
app_config_provider.workspace = true
# The instrument-link tests build legacy payloads as dynamic JSON; production code
# never touches `serde_json`.
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
