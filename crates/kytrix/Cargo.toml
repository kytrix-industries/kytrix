[package]
name = "kytrix"
version.workspace = true
publish.workspace = true
edition.workspace = true

[features]
# The full application: the local translation engine and the notification audio. The
# acceptance build (`--no-default-features --features acceptance`) turns both off because
# its hosts cannot link them: macOS has no libomp (llama.cpp/OpenMP) and Linux has no
# libasound2-dev (rodio -> cpal -> ALSA). Neither feature changes what the shell draws.
default = ["ai", "audio"]
# Selects the production service endpoints. A development build talks to the local
# service on 127.0.0.1 and therefore has to send plaintext over the loopback; a
# production build is TLS-only. Both the origins and the transport policy follow
# from this one switch.
production = ["kytrix_service_provider/production"]
# The local translation engine (llama.cpp behind `ai_translator` -> `llama_sys`/OpenMP).
ai = ["dep:ai_translator"]
# Notification sounds (`news` -> rodio -> cpal; ALSA on Linux).
audio = ["widget_registry/audio"]
# The scripting surface the P6 acceptance self-check runs against: the engine's
# production-visible `automation` feature (input injection + paint observation), and the
# signed-out service session the run installs so it never touches the keyring or the user's
# settings file. Nothing else about the application changes.
acceptance = ["ui_core/automation", "kytrix_service_provider/test-support"]

[dependencies]
bytes = { workspace = true }
env_logger = { workspace = true }
i18n = { workspace = true }
log = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

# Workspace members
app_config = { workspace = true }
app_config_provider = { workspace = true }
base_ui = { workspace = true }
download_provider = { workspace = true }
instrument_selector_ui = { workspace = true }
kytrix_service_provider = { workspace = true }
market_participants_connector = { workspace = true }
market_participants_ui = { workspace = true }
network = { workspace = true }
profile_ui = { workspace = true }
settings_ui = { workspace = true }
ui_core = { workspace = true }
updater_ui = { workspace = true }
widget = { workspace = true }
widget_gallery_ui = { workspace = true }
# The workspace declares the registry without its default features; this crate's `audio`
# feature is what turns the notification sound backend back on.
widget_registry = { workspace = true }

# llama.cpp has no supported Windows ARM64 native build in this workspace yet, so the
# translation dependency is absent there and the app compiles without it. The `ai` feature
# is what enables it on every other target.
[target.'cfg(not(all(target_os = "windows", target_arch = "aarch64")))'.dependencies]
ai_translator = { workspace = true, optional = true }

[build-dependencies]
embed-resource = { workspace = true }

[dev-dependencies]
# The engine test host and the widget test host (the shell's tests open both).
ui_core = { workspace = true, features = ["test-support", "automation"] }
widget = { workspace = true, features = ["test-support"] }
# The headless host installs the connector over the signed-out in-memory session, so a
# test never touches the keyring or the account service. Cargo unifies the feature into
# test builds only; the shipped binary's dependency stays feature-free.
kytrix_service_provider = { workspace = true, features = ["test-support"] }
# The shell's download wiring test builds the same typed request the settings page does.
url = { workspace = true }

[lints]
workspace = true
